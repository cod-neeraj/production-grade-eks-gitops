server.port=8083
spring.application.name=order-service

spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/shopsphere_orders}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:hello}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:MyVerySecretKeyForShopSphereApplicationThatIsAtLeast256BitsLong123456}

services.inventory-url=${INVENTORY_SERVICE_URL:http://localhost:8084}
services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info

logging.level.com.shopsphere=INFO
