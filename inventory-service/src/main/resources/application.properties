server.port=8084
spring.application.name=inventory-service
spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/shopsphere_inventory}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:hello}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET:MyVerySecretKeyForShopSphereApplicationThatIsAtLeast256BitsLong123456}
management.endpoints.web.exposure.include=health,info,prometheus
logging.level.com.shopsphere=INFO
