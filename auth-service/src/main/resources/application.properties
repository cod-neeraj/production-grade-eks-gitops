# Auth Service Configuration
server.port=8081
spring.application.name=auth-service

# Database
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/shopsphere_auth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:hello}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:MyVerySecretKeyForShopSphereApplicationThatIsAtLeast256BitsLong123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Logging
logging.level.com.shopsphere=INFO
logging.level.org.springframework.security=WARN
