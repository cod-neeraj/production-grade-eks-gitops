apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shopsphere-services
  labels:
    release: monitoring
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth-service, product-service, order-service, inventory-service, api-gateway-service]
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
