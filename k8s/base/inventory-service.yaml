apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app: inventory-service
  annotations:
    description: "Inventory service deployment"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  strategy:                           
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        node-role.kubernetes.io/code: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: inventory-service
          image: 088253294231.dkr.ecr.ap-south-1.amazonaws.com/shopsphere/inventory-service:491e7614
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          envFrom:
            - configMapRef:
                name: shop-config
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: inventory-secret, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                 secretKeyRef: { name: inventory-secret, key: DB_PORT }
            - name: DB_NAME
              valueFrom:
                 secretKeyRef: { name: inventory-secret, key: DB_NAME }
            - name: INVENTORY_DB_URL
              value: "jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: inventory-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: inventory-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: auth-service
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8084
      targetPort: http
