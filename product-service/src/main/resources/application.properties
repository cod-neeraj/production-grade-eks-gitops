server.port=8082
spring.application.name=product-service

spring.datasource.url=${PRODUCT_DB_URL:jdbc:postgresql://localhost:5432/shopsphere_products}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:hello}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET:MyVerySecretKeyForShopSphereApplicationThatIsAtLeast256BitsLong123456}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

logging.level.com.shopsphere=INFO
